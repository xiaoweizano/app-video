name: Build debug APK

# 为什么在 CI 构建：本机没有（也不想装）Android SDK。
# GitHub 的 ubuntu-latest runner 自带 Android SDK（ANDROID_SDK_ROOT 已设好），
# 所以 settings.gradle.kts 里的 hasAndroidSdk 条件在 runner 上成立，:app / :ui 会被纳入构建。
#
# 构建产物在 Actions 页面的 Artifacts 里下载，传到手机点一下即可安装（sideload 不需要 adb）。

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - stage-0-container-format

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 固定 debug 签名。不加这一步的话，runner 每次都会新建一个 debug keystore，
      # 于是每个 APK 的签名都不同 —— 手机上「覆盖安装」会因签名不一致失败，只能先卸载。
      # 缓存之后签名稳定，可以直接覆盖安装（开发迭代时省事很多）。
      # 注意：这只是 debug 签名，不能用于 release；release 要用 TODOS.md T0.7 里那个自签名 keystore。
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # 缓存 Gradle 依赖与 wrapper，显著加快第二次之后的构建。
      # 注意这里用官方 setup-gradle：它同时负责 wrapper 校验（我们提交了校验和之外的 properties）。
      - uses: gradle/actions/setup-gradle@v4

      # :core 是纯 Kotlin/JVM 的容器格式与加解密核心 —— 全仓库唯一有真实测试的部分。
      # 它不需要 Android SDK，但放在这里跑可以让每次 APK 构建都顺带守住格式不变量。
      - name: Test the container core
        run: ./gradlew :core:test --console=plain

      # 真正的目的：验证 libVLC 能不能被打进 APK（OV-9 称这是零经验者真正的第一道坎：
      # AAR 100+ MB、多 ABI、extractNativeLibs、16 KB page size、.so 冲突）。
      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --console=plain --stacktrace 2>&1 | tee /tmp/build.log

      # 把实际解析出的 Compose / libVLC 版本打成注解。
      # 为什么需要：本项目第一次真机崩溃就是「版本悄悄错配」—— BOM 2024.01.00 把
      # material3 1.1.2 与 animation-core 1.6.0 钉在一起，两者的 KeyframesSpec API 不兼容，
      # 于是 CircularProgressIndicator 一渲染就 NoSuchMethodError，而编译期完全看不出来。
      # 这个注解让版本组合在每次构建里都可见，不必等装到手机上才发现。
      - name: Report resolved Compose and libVLC versions
        if: always()
        run: |
          TREE=$(./gradlew :app:dependencies --configuration debugRuntimeClasspath --console=plain 2>/dev/null || true)
          # 直接抽 "group:artifact:version" 坐标，不依赖树形前缀字符（上一版按行 sed 时漏掉了 material3/ui，
          # 原因未查明；这种写法在本地对着 :core 的依赖树验证过，能抓全）。
          HITS=$(printf '%s\n' "$TREE" | grep -oE '[a-zA-Z0-9._-]+:[a-zA-Z0-9._-]+:[0-9][^ ]*' | sort -u)
          echo "::notice::compose/libVLC 坐标总数: $(printf '%s\n' "$HITS" | grep -cE '^(androidx\.compose|org\.videolan)')"
          printf '%s\n' "$HITS" | grep -E '^(androidx\.compose\.(material3|animation|ui|runtime|foundation)|org\.videolan)' \
            | head -60 | while IFS= read -r line; do echo "::notice::$line"; done

      # 失败时把编译器错误逐条转成 GitHub 注解。
      # 为什么这么做：job 日志的 API 需要认证，而注解不需要 —— 这样"哪一行编译不过"在公开仓库上
      # 可以被匿名读到，省掉"人肉复制日志"的来回。
      - name: Surface build errors as annotations
        if: failure()
        run: |
          if [ -f /tmp/build.log ]; then
            echo "=== 构建错误（同时已转为注解）==="
            grep -aE "^e: |Unresolved reference|error:|not found|^> Task .*FAILED|^FAILURE:|Caused by:" /tmp/build.log \
              | head -60 | while IFS= read -r line; do echo "::error::$line"; done
            echo "=== 日志尾部 40 行 ==="
            tail -40 /tmp/build.log
          else
            echo "::error::构建日志文件不存在（构建可能没跑到这一步）"
          fi

      # 把体积打进日志：APK 大小主要由 libVLC 的 arm64-v8a 原生库决定（约 50 MB）。
      - name: Report APK size
        run: |
          echo "=== APK ==="
          ls -lh app/build/outputs/apk/debug/*.apk
          echo "=== 打进 APK 的原生库（按 ABI）==="
          unzip -l app/build/outputs/apk/debug/*.apk | grep '\.so$' || echo "（没有 .so —— 说明 libVLC 没被打进去，需要排查）"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 失败时把测试报告带出来，否则只能看日志。
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            core/build/test-results/
          if-no-files-found: ignore
